<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incoming Call</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #111, #333);
    color: white;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone {
    text-align: center;
  }

  .caller {
    font-size: 28px;
    margin-bottom: 10px;
  }

  .subtext {
    color: #ccc;
    margin-bottom: 40px;
  }

  .slider-container {
    width: 250px;
    height: 60px;
    background: rgba(255,255,255,0.1);
    border-radius: 40px;
    position: relative;
    margin: auto;
    overflow: hidden;
  }

  .slider {
    height: 60px;
    width: 60px;
    background: #4CAF50;
    border-radius: 50%;
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    transition: 0.2s;
  }

  .slider:active {
    cursor: grabbing;
  }

  .text {
    position: absolute;
    width: 100%;
    text-align: center;
    line-height: 60px;
    color: #aaa;
  }

</style>
</head>

<body>

<div class="phone">
  <div class="caller">📞 Nishi Vamshi</div>
  <div class="subtext">Incoming Call...</div>

  <div class="slider-container">
    <div class="text">Slide to Answer →</div>
    <div class="slider" id="slider">📞</div>
  </div>
</div>

<script>
  const slider = document.getElementById("slider");
  const container = document.querySelector(".slider-container");

  let isDragging = false;

  slider.addEventListener("mousedown", () => isDragging = true);
  document.addEventListener("mouseup", () => isDragging = false);

  document.addEventListener("mousemove", (e) => {
    if (!isDragging) return;

    let rect = container.getBoundingClientRect();
    let x = e.clientX - rect.left - 30;

    if (x < 0) x = 0;
    if (x > rect.width - 60) x = rect.width - 60;

    slider.style.left = x + "px";

    // If reached end → redirect
    if (x >= rect.width - 65) {
      window.location.href = "form.html";
    }
  });

  // Mobile support
  slider.addEventListener("touchstart", () => isDragging = true);
  document.addEventListener("touchend", () => isDragging = false);

  document.addEventListener("touchmove", (e) => {
    if (!isDragging) return;

    let rect = container.getBoundingClientRect();
    let x = e.touches[0].clientX - rect.left - 30;

    if (x < 0) x = 0;
    if (x > rect.width - 60) x = rect.width - 60;

    slider.style.left = x + "px";

    if (x >= rect.width - 65) {
      window.location.href = "form.html";
    }
  });
</script>

</body>
</html>
