<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incoming Call</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  /* Background image */
  .background {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url('cover.jpeg') no-repeat center/cover;
    filter: blur(8px) brightness(0.6);
    z-index: -1;
  }

  .screen {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    color: white;
    text-align: center;
    padding: 60px 20px;
  }

  .top {
    margin-top: 40px;
  }

  .caller {
    font-size: 32px;
    font-weight: 500;
  }

  .subtext {
    font-size: 16px;
    color: #ccc;
    margin-top: 10px;
  }

  /* Slider */
  .slider-container {
    width: 280px;
    height: 60px;
    background: rgba(255,255,255,0.2);
    border-radius: 40px;
    position: relative;
    overflow: hidden;
    margin-bottom: 40px;
  }

  .slider-text {
    position: absolute;
    width: 100%;
    text-align: center;
    line-height: 60px;
    color: #eee;
    font-size: 16px;
  }

  .slider {
    height: 60px;
    width: 60px;
    background: #4cd964;
    border-radius: 50%;
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: grab;
    transition: 0.2s;
  }

  .slider:active {
    cursor: grabbing;
  }

  /* Mobile fit */
  @media (max-width: 600px) {
    .caller {
      font-size: 26px;
    }
  }
</style>
</head>

<body>

<div class="background"></div>

<div class="screen">
  <div class="top">
    <div class="caller">💍 Nishi ❤️ Vamshi</div>
    <div class="subtext">Incoming Call...</div>
  </div>

  <div class="slider-container">
    <div class="slider-text">Slide to Answer →</div>
    <div class="slider" id="slider">📞</div>
  </div>
</div>

<script>
  const slider = document.getElementById("slider");
  const container = document.querySelector(".slider-container");

  let isDragging = false;

  slider.addEventListener("mousedown", () => isDragging = true);
  document.addEventListener("mouseup", () => isDragging = false);

  document.addEventListener("mousemove", (e) => {
    if (!isDragging) return;

    let rect = container.getBoundingClientRect();
    let x = e.clientX - rect.left - 30;

    if (x < 0) x = 0;
    if (x > rect.width - 60) x = rect.width - 60;

    slider.style.left = x + "px";

    if (x >= rect.width - 65) {
      window.location.href = "form.html";
    }
  });

  // Mobile support
  slider.addEventListener("touchstart", () => isDragging = true);
  document.addEventListener("touchend", () => isDragging = false);

  document.addEventListener("touchmove", (e) => {
    if (!isDragging) return;

    let rect = container.getBoundingClientRect();
    let x = e.touches[0].clientX - rect.left - 30;

    if (x < 0) x = 0;
    if (x > rect.width - 60) x = rect.width - 60;

    slider.style.left = x + "px";

    if (x >= rect.width - 65) {
      window.location.href = "form.html";
    }
  });
</script>

</body>
</html>
