<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incoming Call</title>

<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }

  /* Background Image */
  .background img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Overlay */
  .screen {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    color: white;
    text-align: center;
    padding: 60px 20px;
  }

  /* Caller section */
  .top {
    margin-top: 40px;
  }

  .caller-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 15px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .caller {
    font-size: 30px;
    font-weight: 500;
  }

  .subtext {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    margin-top: 5px;
  }

  /* Slider */
  .slider-container {
    width: 300px;
    max-width: 90%;
    height: 60px;
    border-radius: 40px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
    margin-bottom: 40px;
  }

  .slider-text {
    position: absolute;
    width: 100%;
    text-align: center;
    line-height: 60px;
    color: rgba(255,255,255,0.8);
    font-size: 16px;
    letter-spacing: 1px;
  }

  .slider {
    width: 60px;
    height: 60px;
    background: white;
    color: black;
    border-radius: 50%;
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: grab;
    transition: 0.2s;
  }

  .slider:active {
    cursor: grabbing;
  }

</style>
</head>

<body>

<!-- Background -->
<div class="background">
  <img src="cover.jpeg" alt="Couple">
</div>

<!-- UI -->
<div class="screen">

  <div class="top">
    <!-- Caller Photo -->
    <img src="cover.jpeg" class="caller-img" alt="Caller">

    <div class="caller">Nishi ❤️ Vamshi</div>
    <div class="subtext">incoming call...</div>
  </div>

  <!-- Slider -->
  <div class="slider-container">
    <div class="slider-text">slide to answer</div>
    <div class="slider" id="slider">→</div>
  </div>

</div>

<script>
  const slider = document.getElementById("slider");
  const container = document.querySelector(".slider-container");

  let isDragging = false;

  slider.addEventListener("mousedown", () => isDragging = true);
  document.addEventListener("mouseup", () => isDragging = false);

  document.addEventListener("mousemove", (e) => {
    if (!isDragging) return;

    let rect = container.getBoundingClientRect();
    let x = e.clientX - rect.left - 30;

    if (x < 0) x = 0;
    if (x > rect.width - 60) x = rect.width - 60;

    slider.style.left = x + "px";

    if (x >= rect.width - 65) {
      window.location.href = "invite.html";
    }
  });

  // Mobile support
  slider.addEventListener("touchstart", () => isDragging = true);
  document.addEventListener("touchend", () => isDragging = false);

  document.addEventListener("touchmove", (e) => {
    if (!isDragging) return;

    let rect = container.getBoundingClientRect();
    let x = e.touches[0].clientX - rect.left - 30;

    if (x < 0) x = 0;
    if (x > rect.width - 60) x = rect.width - 60;

    slider.style.left = x + "px";

    if (x >= rect.width - 65) {
      window.location.href = "invite.html";
    }
  });
</script>

</body>
</html>
