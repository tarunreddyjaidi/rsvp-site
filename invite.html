<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
      background-color: black; /* fills empty space */
    }

    .container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start; /* top-align for button */
      overflow: hidden;
    }

    .bg-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain; /* full image visible */
      display: block;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      top: 20px; /* button at top */
      width: 100%;
      text-align: center;
      z-index: 2;
    }

    .btn {
      background-color: #d44;
      color: white;
      padding: 14px 28px;
      font-size: 18px;
      border-radius: 30px;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .btn:hover {
      background-color: #b33;
    }

    @media (max-width: 600px) {
      .btn {
        font-size: 16px;
        padding: 12px 24px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <!-- FULL IMAGE VISIBLE -->
  <img src="Sangeeth.jpg" class="bg-img" alt="Invitation">

  <!-- BUTTON AT TOP -->
  <div class="overlay">
    <a href="form.html" class="btn">Open Invitation 💌</a>
  </div>
</div>

</body>
</html>
