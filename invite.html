<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      position: relative;
      height: 100vh;
      width: 100%;
    }

    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* full image visible */
      background-color: black;
    }

    .overlay {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
    }

    .btn {
      background-color: #d44;
      color: white;
      padding: 14px 28px;
      font-size: 18px;
      border-radius: 30px;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background-color: #b33;
    }

    @media (max-width: 600px) {
      .btn {
        font-size: 16px;
        padding: 12px 24px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <!-- YOUR IMAGE -->
  <img src="cover.jpeg" class="bg-img" alt="Invitation">

  <!-- BUTTON -->
  <div class="overlay">
    <a href="form.html" class="btn">Open Invitation 💌</a>
  </div>
</div>

</body>
</html>
